name: 缺陷报告
description: 报告可以复现的功能问题。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        不要上传真实学生信息、作文原文、数据库、备份或 API 密钥。
        安全漏洞请按 SECURITY.md 私下报告。
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 填写操作系统、Python 版本、浏览器、项目版本或 commit，以及启动方式。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用演示账号或人工构造的数据描述操作步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 可以附上脱敏的错误日志或截图。
    validations:
      required: true
